    <!-- RIGHT MAIN: Program Monitor + Editorial Write-up & BTS Pictures -->
    <article class="editorial-main">

      <!-- Program Monitor Player -->
      <section class="player-container" aria-label="Film Player">
        <div class="player-screen is-paused" id="player-screen">
          <video 
            id="work-video" 
            controls 
            playsinline 
            preload="none" 
            poster="assets/media/north-face-poster.jpg"
            src="assets/media/north-face.mp4"
          >
          </video>

          <!-- YouTube embed (used when a film has data-youtube-id) -->
          <iframe
            class="player-youtube"
            id="work-youtube"
            title="Film Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>

          <!-- Interactive Video Title Pause Pop-up -->
          <div class="video-pause-overlay" id="video-pause-overlay" role="button" aria-label="Resume Video" tabindex="0">
            <div class="pause-overlay-backdrop"></div>
            <div class="pause-overlay-content">
              <h2 class="pause-video-title" id="pause-video-title">The North Face &mdash; Mothers</h2>
            </div>
          </div>
        </div>

        <!-- Spot switcher (shown only for multi-video campaigns) -->
        <div class="player-spots" id="player-spots" role="tablist" aria-label="Campaign spots" hidden></div>

        <div class="player-meta">
          <h1 class="player-title" id="player-title">The North Face &mdash; Mothers</h1>
          <p class="player-subtitle" id="player-subtitle">Commercial &bull; Directed &amp; Photographed by Scotch</p>
        </div>
      </section>

      <!-- Project Editorial Write-Up (NYT / Blog Style with Text Wrapped Around Images) -->
      <article class="nyt-article" id="editorial-article" aria-label="Project Production Story">

        <!-- Prose with Floated Images (Text wraps fluidly) -->
        <div class="nyt-prose" id="article-prose"><!-- filled by js/work.js -->
        </div>
